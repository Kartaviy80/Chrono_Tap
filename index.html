<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Chrono Tap - Universal Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background: #050811;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }
        .hud {
            position: absolute;
            top: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }
        .icon {
            font-size: 28px;
            filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.8));
        }
        .score {
            font-size: 52px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 20px #38bdf8, 0 0 40px #38bdf8;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .game-container {
            position: relative;
            width: 90vw;
            max-width: 380px;
            height: 90vw;
            max-height: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="hud">
        <span class="icon">🏆</span>
        <div class="score" id="score">0</div>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas" width="700" height="700"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = 230;

        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;

        // Вращение и параметры цели
        let needleAngle = 0;
        let needleSpeed = 0.038;
        let needleDirection = 1;
        let trailHistory = [];

        const targetColors = ['#22c55e', '#a855f7', '#ec4899', '#f59e0b', '#06b6d4', '#3b82f6', '#ff0055'];
        let currentColorIndex = 0;

        let targetStart = 0;
        let targetSize = Math.PI / 3;
        let pulseTimer = 0;

        // Взрывные частицы, волны и фоновая пыль
        let particles = [];
        let shockwaves = [];
        let bgDust = [];

        // Инициализация фоновой космической пыли
        for (let i = 0; i < 40; i++) {
            bgDust.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 1,
                alpha: Math.random() * 0.5 + 0.2,
                speedY: Math.random() * 0.3 + 0.1
            });
        }

        // --- Звуковой движок (Без слов, только эффекты) ---
        let audioCtx = null;
        let bgOsc1 = null, bgOsc2 = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function startBgMusic() {
            if (!audioCtx || bgOsc1) return;
            bgOsc1 = audioCtx.createOscillator();
            bgOsc2 = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            bgOsc1.type = 'sine';
            bgOsc2.type = 'triangle';

            bgOsc1.frequency.setValueAtTime(98.00, audioCtx.currentTime); // G2
            bgOsc2.frequency.setValueAtTime(146.83, audioCtx.currentTime); // D3

            gainNode.gain.setValueAtTime(0.02, audioCtx.currentTime);

            bgOsc1.connect(gainNode);
            bgOsc2.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            bgOsc1.start();
            bgOsc2.start();
        }

        function playHitSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25 + score * 30, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
        }

        function playFailSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        // Эффект 1: Спавн искр
        function createExplosion(x, y, color) {
            for (let i = 0; i < 35; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 10 + 3;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 5 + 2,
                    color: color,
                    alpha: 1,
                    decay: Math.random() * 0.03 + 0.015
                });
            }
        }

        // Эффект 2: Ударная взрывная волна
        function createShockwave(x, y, color) {
            shockwaves.push({
                x: x, y: y,
                radius: 10,
                maxRadius: 120,
                color: color,
                alpha: 1
            });
        }

        function generateTarget() {
            const baseSize = Math.PI / (2.8 + Math.random() * 1.5);
            targetSize = Math.max(Math.PI / 9, baseSize * Math.max(0.35, 1 - score * 0.025));
            targetStart = Math.random() * (Math.PI * 2 - targetSize);
            currentColorIndex = (currentColorIndex + 1) % targetColors.length;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Анимация космической пыли на фоне
            bgDust.forEach(p => {
                p.y -= p.speedY;
                if (p.y < 0) p.y = canvas.height;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
                ctx.fill();
            });

            pulseTimer += 0.06;
            const pulse = Math.sin(pulseTimer) * 4;

            // 2. Основное направляющее кольцо
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 22;
            ctx.stroke();

            // 3. Целевой динамический сектор
            const currentColor = targetColors[currentColorIndex];
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, targetStart, targetStart + targetSize);
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = 26 + pulse;
            ctx.lineCap = 'round';
            ctx.shadowColor = currentColor;
            ctx.shadowBlur = 25;
            ctx.stroke();
            ctx.shadowBlur = 0;

            // 4. Шлейф кометы за указателем
            const currentNeedleX = centerX + Math.cos(needleAngle) * radius;
            const currentNeedleY = centerY + Math.sin(needleAngle) * radius;

            if (gameState === 'PLAYING') {
                trailHistory.push({ x: currentNeedleX, y: currentNeedleY, alpha: 1 });
                if (trailHistory.length > 12) trailHistory.shift();
            }

            trailHistory.forEach((t, index) => {
                t.alpha -= 0.07;
                if (t.alpha > 0) {
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, 14 * (index / trailHistory.length), 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(56, 189, 248, ${t.alpha})`;
                    ctx.fill();
                }
            });

            // 5. Главный вращающийся указатель
            ctx.beginPath();
            ctx.arc(currentNeedleX, currentNeedleY, 18, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = '#38bdf8';
            ctx.shadowBlur = 25;
            ctx.fill();
            ctx.shadowBlur = 0;

            // 6. Отрисовка ударных волн (Shockwaves)
            shockwaves.forEach((sw, index) => {
                sw.radius += 6;
                sw.alpha -= 0.03;
                if (sw.alpha <= 0 || sw.radius >= sw.maxRadius) {
                    shockwaves.splice(index, 1);
                } else {
                    ctx.beginPath();
                    ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
                    ctx.strokeStyle = sw.color;
                    ctx.lineWidth = 4;
                    ctx.globalAlpha = sw.alpha;
                    ctx.stroke();
                    ctx.globalAlpha = 1;
                }
            });

            // 7. Отрисовка взрывных искр
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 12;
                    ctx.fill();
                    ctx.restore();
                }
            });

            // 8. Визуальная графическая кнопка "Старт / Повторить" на самом Canvas (Без слов!)
            if (gameState === 'START' || gameState === 'GAMEOVER') {
                ctx.beginPath();
                ctx.arc(centerX, centerY, 55, 0, Math.PI * 2);
                ctx.fillStyle = '#38bdf8';
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 30;
                ctx.fill();
                ctx.shadowBlur = 0;

                // Значок "Play" (Треугольник)
                ctx.beginPath();
                ctx.moveTo(centerX - 12, centerY - 20);
                ctx.lineTo(centerX + 22, centerY);
                ctx.lineTo(centerX - 12, centerY + 20);
                ctx.fillStyle = '#050811';
                ctx.fill();
            }
        }

        function update() {
            if (gameState === 'PLAYING') {
                needleAngle += needleSpeed * needleDirection;
                if (needleAngle > Math.PI * 2) needleAngle -= Math.PI * 2;
                if (needleAngle < 0) needleAngle += Math.PI * 2;
            }
            draw();
            requestAnimationFrame(update);
        }

        function handleTap() {
            initAudio();
            startBgMusic();

            if (gameState === 'START' || gameState === 'GAMEOVER') {
                score = 0;
                scoreEl.innerText = score;
                needleSpeed = 0.04;
                needleAngle = 0;
                particles = [];
                shockwaves = [];
                trailHistory = [];
                generateTarget();
                gameState = 'PLAYING';
            } else if (gameState === 'PLAYING') {
                let normalizedNeedle = needleAngle % (Math.PI * 2);
                if (normalizedNeedle < 0) normalizedNeedle += Math.PI * 2;

                let targetEnd = targetStart + targetSize;

                if (normalizedNeedle >= targetStart && normalizedNeedle <= targetEnd) {
                    score++;
                    scoreEl.innerText = score;
                    playHitSound();

                    const hitX = centerX + Math.cos(needleAngle) * radius;
                    const hitY = centerY + Math.sin(needleAngle) * radius;

                    createExplosion(hitX, hitY, targetColors[currentColorIndex]);
                    createShockwave(hitX, hitY, targetColors[currentColorIndex]);

                    scoreEl.style.transform = 'scale(1.3)';
                    setTimeout(() => scoreEl.style.transform = 'scale(1)', 100);

                    needleDirection *= -1;
                    needleSpeed = Math.min(0.1, needleSpeed + 0.0035);
                    generateTarget();
                } else {
                    playFailSound();
                    gameState = 'GAMEOVER';
                }
            }
        }

        window.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            handleTap();
        });

        update();
    </script>
</body>
</html>
